# ============================
# EDUCENTER - APPLICATION CONFIG
# ============================

# Server
server.port=8080

# ============================
# DATABASE (MySQL)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/educenter_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Dung@3101
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# Khong tu dong tao bang, chay truc tiep bang file csdl.sql va data.sql
# ============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# Thymeleaf
# ============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================
# Static Resources
# ============================
spring.web.resources.static-locations=classpath:/static/

# ============================
# Logging
# ============================
logging.level.root=INFO
logging.level.com.educenter=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================
# VNPay (Placeholder - Dien thong tin that khi co)
# ============================
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.tmn-code=YOUR_TMN_CODE
vnpay.hash-secret=YOUR_HASH_SECRET
vnpay.return-url=http://localhost:8080/api/vnpay/return
