<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng thông tin Phụ huynh - EduCenter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar dùng chung -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
        <div>
            <h2 class="h3 fw-bold text-dark">Cổng thông tin Phụ huynh</h2>
            <p class="text-muted mb-0">Xin chào phụ huynh: <strong th:text="${currentUser.fullName}">Phụ huynh</strong></p>
        </div>
        <span class="badge bg-primary p-2 fs-6">
            <i class="bi bi-person-heart me-1"></i> Quyền Phụ huynh
        </span>
    </div>

    <div class="row g-4">
        <!-- Card 1: Quản lý con -->
        <div class="col-md-3">
            <div class="card h-100 border-0 shadow-sm rounded-3">
                <div class="card-body text-center p-4">
                    <i class="bi bi-person-lines-fill text-primary fs-1 mb-3"></i>
                    <h5 class="fw-bold">Hồ sơ con cái</h5>
                    <p class="text-muted small">Xem danh sách các con đang học</p>
                    <button class="btn btn-outline-primary btn-sm w-100" disabled>Xem hồ sơ</button>
                </div>
            </div>
        </div>

        <!-- Card 2: Đăng ký học -->
        <div class="col-md-3">
            <div class="card h-100 border-0 shadow-sm rounded-3">
                <div class="card-body text-center p-4">
                    <i class="bi bi-journal-plus text-success fs-1 mb-3"></i>
                    <h5 class="fw-bold">Đăng ký lớp học</h5>
                    <p class="text-muted small">Đăng ký môn Toán, Lý, Hóa cho con</p>
                    <button class="btn btn-outline-success btn-sm w-100" disabled>Đăng ký ngay</button>
                </div>
            </div>
        </div>

        <!-- Card 3: Kết quả học tập -->
        <div class="col-md-3">
            <div class="card h-100 border-0 shadow-sm rounded-3">
                <div class="card-body text-center p-4">
                    <i class="bi bi-clipboard2-data-fill text-warning fs-1 mb-3"></i>
                    <h5 class="fw-bold">Kết quả học tập</h5>
                    <p class="text-muted small">Theo dõi điểm số và chuyên cần</p>
                    <button class="btn btn-outline-warning btn-sm w-100" disabled>Xem kết quả</button>
                </div>
            </div>
        </div>

        <!-- Card 4: Học phí & VNPay -->
        <div class="col-md-3">
            <div class="card h-100 border-0 shadow-sm rounded-3">
                <div class="card-body text-center p-4">
                    <i class="bi bi-credit-card-2-front-fill text-danger fs-1 mb-3"></i>
                    <h5 class="fw-bold">Học phí & VNPay</h5>
                    <p class="text-muted small">Tra cứu và thanh toán học phí online</p>
                    <button class="btn btn-outline-danger btn-sm w-100" disabled>Thanh toán</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
