<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản Phụ huynh - EduCenter</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 15px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-width: 650px;
            width: 100%;
        }
        .register-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .register-body {
            padding: 30px;
        }
        .btn-register {
            background: #0d6efd;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-register:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="register-header">
        <i class="bi bi-person-plus-fill fs-1"></i>
        <h4 class="fw-bold mb-1">ĐĂNG KÝ TÀI KHOẢN PHỤ HUYNH</h4>
        <p class="mb-0 text-white-50 small">Tạo tài khoản để theo dõi và đăng ký học cho con tại EduCenter</p>
    </div>

    <div class="register-body">
        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <div class="row g-3">
                <!-- Tên đăng nhập -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" placeholder="Ví dụ: ph_minh">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <!-- Họ và tên -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{fullName}" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Ví dụ: Nguyễn Văn Minh">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>

                <!-- Mật khẩu -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Tối thiểu 6 ký tự">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" placeholder="Nhập lại mật khẩu">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="email@gmail.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <!-- Số điện thoại -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số điện thoại</label>
                    <input type="text" class="form-control" th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="0912345678">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <!-- Địa chỉ -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Địa chỉ</label>
                    <input type="text" class="form-control" th:field="*{address}" placeholder="Quận/Huyện, Tỉnh/TP">
                </div>

                <!-- Nghề nghiệp -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nghề nghiệp</label>
                    <input type="text" class="form-control" th:field="*{occupation}" placeholder="Ví dụ: Kỹ sư, Kinh doanh">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-register mt-4">
                <i class="bi bi-check-lg me-1"></i> Hoàn tất đăng ký
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Đã có tài khoản?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold small ms-1">Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
