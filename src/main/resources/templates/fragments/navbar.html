<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-mortarboard-fill fs-4 me-2"></i>
            <span>EDUCENTER</span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <div class="text-white text-end d-none d-sm-block">
                <div class="fw-semibold small" th:text="${currentUser != null ? currentUser.fullName : 'Người dùng'}">Họ tên</div>
                <span class="badge bg-light text-primary small" th:text="${currentUser != null ? currentUser.roleName : 'USER'}">ROLE</span>
            </div>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
